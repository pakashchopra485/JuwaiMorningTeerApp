name: Build Juwai Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "Juwai-Morning-Teer-Android-Cloud-Build.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set Java and Kotlin target to 17
        run: |
          python3 - <<'PY'
          import os
          p = os.path.join(os.environ["PROJECT_DIR"], "app", "build.gradle.kts")
          with open(p, "r") as f:
              s = f.read()
          block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace("android {", "android {\n" + block, 1)
          with open(p, "w") as f:
              f.write(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Juwai-Morning-Teer-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
